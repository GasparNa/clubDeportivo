name: club-deportivo

services:
  db:
    image: postgres:16-alpine
    container_name: club-deportivo-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-club_deportivo}
      POSTGRES_USER: ${POSTGRES_USER:-club_deportivo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-club_deportivo_dev}
      TZ: America/Argentina/Buenos_Aires
      PGTZ: America/Argentina/Buenos_Aires
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    container_name: club-deportivo-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-club_deportivo}:${POSTGRES_PASSWORD:-club_deportivo_dev}@db:5432/${POSTGRES_DB:-club_deportivo}?schema=public
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-24h}
      DB_CONNECTION_LIMIT: ${DB_CONNECTION_LIMIT:-5}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      RUN_MIGRATIONS: "true"
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/v1/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: runtime
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api/v1}
    container_name: club-deportivo-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
