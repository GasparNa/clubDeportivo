name: CI

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'infra/**'
      - '.gitignore'
      - 'render.yaml'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'infra/**'
      - '.gitignore'
      - 'render.yaml'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  calidad:
    name: Lint y pruebas unitarias
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.8.1

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Validar especificaciones OpenSpec
        run: pnpm exec openspec validate --all --strict

      - name: Ejecutar lint del backend
        run: pnpm --filter club-deportivo-backend run lint

      - name: Ejecutar lint del frontend
        run: pnpm --filter frontend run lint

      - name: Generar cliente Prisma
        run: pnpm --filter club-deportivo-backend run prisma:generate

      - name: Verificar tipos del backend
        run: pnpm --filter club-deportivo-backend run typecheck

      - name: Validar compose de producción
        env:
          POSTGRES_PASSWORD: ci-placeholder
          JWT_SECRET: ci-placeholder-ci-placeholder-32chars
        run: docker compose -f docker-compose.prod.yml config -q

      - name: Ejecutar pruebas unitarias
        run: pnpm --filter club-deportivo-backend exec jest --runInBand
