name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Construir y publicar imágenes
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success') }}

    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar variables
        id: vars
        run: |
          TAG="${GITHUB_SHA::7}"
          echo "image_tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadatos para Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Construir y publicar imagen Backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Metadatos para Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/frontend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Construir y publicar imagen Frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          target: runtime
          build-args: |
            NEXT_PUBLIC_API_URL=https://clubdeportivo.alquilerespunilla.com.ar/api/v1
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-aws:
    name: Desplegar en AWS (Caddy + Docker Compose)
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Verificar configuración de secretos
        id: check-secrets
        run: |
          if [ -z "${{ secrets.DEPLOY_HOST }}" ] || [ -z "${{ secrets.DEPLOY_USER }}" ] || [ -z "${{ secrets.DEPLOY_KEY }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ Secretos de despliegue (DEPLOY_HOST, DEPLOY_USER, DEPLOY_KEY) no configurados en el repositorio."
            echo "Las imágenes fueron construidas y publicadas en ghcr.io. Se omite el despliegue SSH automático."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sincronizar archivos de configuración con AWS
        if: steps.check-secrets.outputs.configured == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: "Caddyfile,docker-compose.prod.yml,scripts/deploy-aws.sh"
          target: "/opt/club-deportivo"

      - name: Ejecutar despliegue remoto en AWS
        if: steps.check-secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.0
        env:
          BACKEND_IMAGE: ghcr.io/${{ github.repository }}/backend:latest
          FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/frontend:latest
          CR_PAT: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: BACKEND_IMAGE,FRONTEND_IMAGE,CR_PAT,ACTOR
          script: |
            cd /opt/club-deportivo
            chmod +x scripts/deploy-aws.sh
            echo "$CR_PAT" | docker login ghcr.io -u "$ACTOR" --password-stdin || true
            export BACKEND_IMAGE="$BACKEND_IMAGE"
            export FRONTEND_IMAGE="$FRONTEND_IMAGE"
            ./scripts/deploy-aws.sh

      - name: Smoke test público
        if: steps.check-secrets.outputs.configured == 'true'
        run: |
          echo "Verificando endpoint público https://clubdeportivo.alquilerespunilla.com.ar/api/v1/health"
          curl --fail --retry 5 --retry-delay 5 --retry-connrefused -sS https://clubdeportivo.alquilerespunilla.com.ar/api/v1/health
