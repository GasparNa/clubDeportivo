name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Construir y publicar imágenes
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar variables
        id: vars
        run: |
          TAG="${GITHUB_SHA::7}"
          echo "image_tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadatos para Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Construir y publicar imagen Backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Metadatos para Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/frontend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Construir y publicar imagen Frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          target: runtime
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://clubdeportivo.alquilerespunilla.com.ar/api/v1
          tags: ${{ steps.meta-frontend.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-aws:
    name: Desplegar en AWS (Caddy + Docker Compose)
    runs-on: ubuntu-latest
    needs: build-and-push
    timeout-minutes: 25

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Verificar secretos de despliegue
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          missing=()
          [ -z "$DEPLOY_HOST" ] && missing+=("DEPLOY_HOST")
          [ -z "$DEPLOY_USER" ] && missing+=("DEPLOY_USER")
          [ -z "$DEPLOY_KEY" ] && missing+=("DEPLOY_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Faltan secretos de despliegue: ${missing[*]}. Configurarlos en Settings → Secrets and variables → Actions → Secrets."
            exit 1
          fi
          echo "✅ Secretos de despliegue configurados."

      - name: Verificar servidor de destino
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 2m
          script: |
            set -e
            test -d /opt/club-deportivo || {
              echo "ERROR: no existe /opt/club-deportivo. Ejecutar una vez: sudo mkdir -p /opt/club-deportivo && sudo chown -R $USER:$USER /opt/club-deportivo"
              exit 1
            }
            test -w /opt/club-deportivo || {
              echo "ERROR: el usuario $USER no puede escribir en /opt/club-deportivo. Ejecutar: sudo chown -R $USER:$USER /opt/club-deportivo"
              exit 1
            }
            test -f /opt/club-deportivo/.env.prod || {
              echo "ERROR: falta /opt/club-deportivo/.env.prod con POSTGRES_PASSWORD y JWT_SECRET."
              exit 1
            }
            command -v docker >/dev/null || { echo "ERROR: Docker no está instalado."; exit 1; }
            docker compose version

      - name: Sincronizar archivos de configuración con AWS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: "Caddyfile,docker-compose.prod.yml,scripts/deploy-aws.sh"
          target: "/opt/club-deportivo"

      - name: Ejecutar despliegue remoto en AWS
        uses: appleboy/ssh-action@v1.2.0
        env:
          BACKEND_IMAGE: ghcr.io/${{ github.repository }}/backend:latest
          FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/frontend:latest
          CR_PAT: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 15m
          envs: BACKEND_IMAGE,FRONTEND_IMAGE,CR_PAT,ACTOR
          script: |
            set -euo pipefail
            cd /opt/club-deportivo
            chmod +x scripts/deploy-aws.sh
            echo "$CR_PAT" | docker login ghcr.io -u "$ACTOR" --password-stdin
            export BACKEND_IMAGE FRONTEND_IMAGE
            ./scripts/deploy-aws.sh

      - name: Smoke test público
        run: |
          echo "Verificando endpoint público https://clubdeportivo.alquilerespunilla.com.ar/api/v1/health"
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 5 --retry-connrefused \
            --max-time 30 \
            https://clubdeportivo.alquilerespunilla.com.ar/api/v1/health
