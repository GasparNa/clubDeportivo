version: 2
updates:
  - package-ecosystem: pnpm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      pnpm-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: pnpm
    directory: "/backend"
    schedule:
      interval: weekly
    groups:
      pnpm-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: pnpm
    directory: "/frontend"
    schedule:
      interval: weekly
    groups:
      pnpm-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions-minor-and-patch:
        update-types:
          - minor
          - patch
